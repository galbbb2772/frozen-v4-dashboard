name: Patch Beta Hedge tab

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'beta-hedge.html'
      - 'data/beta_hedge.json'
      - '.github/workflows/patch_beta_hedge.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch dashboard index
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'data-tab="hedge"' not in s:
              anchor='  <button data-tab="historical">历史回测</button>'
              s=s.replace(anchor,'  <button data-tab="hedge">Beta Hedge</button>\n'+anchor)
          if 'id="hedge" class="panel"' not in s:
              anchor='<section id="historical" class="panel">'
              block='''<section id="hedge" class="panel">\n  <div class="card" style="padding:0;overflow:hidden">\n    <iframe src="beta-hedge.html" title="Beta Hedge Forward OOS" style="display:block;width:100%;height:1750px;border:0;background:transparent"></iframe>\n  </div>\n</section>\n\n'''
              s=s.replace(anchor,block+anchor)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "frozen-v4-dashboard-bot"
          git config user.email "frozen-v4-dashboard-bot@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Index already patched."
            exit 0
          fi
          git commit -m "dashboard: expose beta hedge tab"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && break
            if [ "$attempt" = "3" ]; then exit 1; fi
            sleep $((attempt*3))
          done
