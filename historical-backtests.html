<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>8 Strategies Historical · Frozen V4</title><script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<script src="plotly-mobile-guard.js"></script><style>:root{--bg:#070a10;--p:#101722;--line:#263248;--t:#edf4ff;--m:#8e9db2;--g:#57d69f;--r:#ff7d89;--a:#8db8ff;--w:#f0c96c}*{box-sizing:border-box}body{margin:0;background:#080d15;color:var(--t);font:14px Inter,system-ui,sans-serif}.wrap{max-width:1400px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{margin:4px 0;font-size:30px}.m{color:var(--m)}.tabs{display:flex;gap:7px;overflow:auto;margin:16px 0}.tabs button{border:1px solid #2a354b;background:#111826;color:#cdd7e8;padding:8px 11px;border-radius:10px;white-space:nowrap;cursor:pointer}.tabs button.on{background:#1b2c49;border-color:#557bc0;color:white}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:9px}.card{background:linear-gradient(180deg,#121927,#0f1420);border:1px solid var(--line);border-radius:15px;padding:14px}.k{font-size:10px;color:var(--m);letter-spacing:.08em;text-transform:uppercase}.v{font-size:23px;font-weight:800;margin:5px 0}.section{margin-top:12px}.two{display:grid;grid-template-columns:1.15fr .85fr;gap:12px}.chart{height:410px}.smallchart{height:330px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:12px}th,td{padding:9px 8px;border-bottom:1px solid #202b3e;text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}th{color:var(--m)}.good{color:var(--g)}.bad{color:var(--r)}.warn{color:var(--w)}.note{border-left:3px solid #496c9c;padding:10px 12px;background:#0b111b;color:#aeb9ca;line-height:1.6}.pill{display:inline-block;border:1px solid #32415a;border-radius:999px;padding:3px 7px;font-size:10px}.links a{color:#9fc2ff;text-decoration:none;margin-right:12px}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}.wrap{padding:11px}.chart{height:340px}}</style></head><body><div class="wrap"><div class="top"><div><div class="k">Frozen V4 · Historical Backtest Center</div><h1>8 Strategies Historical</h1><div class="m">2019-01 → 2026-03 · MAIN-B + 5 frozen lanes + Late-50 / Late-67</div></div><div class="links"><a href="./">← Dashboard</a><a href="late-survival.html?arm=67">Late-67 →</a></div></div><div class="tabs" id="buttons"></div><div class="grid" id="cards"></div><div class="section card"><div class="k">Historical equity</div><div id="equity" class="chart"></div></div><div class="section two"><div class="card"><div class="k">Drawdown</div><div id="dd" class="smallchart"></div></div><div class="card"><div class="k">$100,000 model account</div><div id="capital" class="smallchart"></div></div></div><div class="section card"><div class="k">Annual return</div><div id="annual" class="chart"></div></div><div class="section card"><div class="k">All 8 strategy summary</div><div id="summary" class="tablewrap"></div></div><div class="section note" id="note"></div></div><script>
const IDS=['MAIN-B','BENCH-A','SHADOW-3S','SHADOW-SAT20','REGIME-COMBO50','UPPER-BOX50','LATE-SURVIVAL-50','LATE-SURVIVAL-67'];
const LABEL={'MAIN-B':'MAIN-B','BENCH-A':'BENCH-A','SHADOW-3S':'3-slot Quality','SHADOW-SAT20':'Q3 Satellite 20%','REGIME-COMBO50':'Regime Combo50','UPPER-BOX50':'Upper Box 50%','LATE-SURVIVAL-50':'Late 50→100','LATE-SURVIVAL-67':'Late 66.7→100'};
const ROLE={'MAIN-B':'MAIN','BENCH-A':'BENCHMARK','SHADOW-3S':'SHADOW','SHADOW-SAT20':'SHADOW','REGIME-COMBO50':'SHADOW','UPPER-BOX50':'SHADOW','LATE-SURVIVAL-50':'SHADOW','LATE-SURVIVAL-67':'SHADOW'};
const META={'MAIN-B':{ending:13.72386331,cagr:43.57372,mdd:-36.31208,trades:272},'BENCH-A':{ending:11.73523491,cagr:40.50342,mdd:-37.38110,trades:268},'SHADOW-3S':{ending:12.68422980,cagr:42.02034,mdd:-33.83819,trades:365},'SHADOW-SAT20':{ending:14.00533828,cagr:43.97680,mdd:-36.31208,trades:284},'REGIME-COMBO50':{ending:18.224028,cagr:49.308081,mdd:-23.403647,trades:272},'UPPER-BOX50':{ending:14.70073589,cagr:44.94349,mdd:-36.31208,trades:272},'LATE-SURVIVAL-50':{ending:5.50658026,cagr:26.56363,mdd:-20.76632,trades:272},'LATE-SURVIVAL-67':{ending:7.62760864,cagr:32.38832,mdd:-26.38440,trades:272}};
const REGIME_ANNUAL=[['2019',17.173],['2020',3.924],['2021',197.317],['2022',1.708],['2023',185.922],['2024',59.783],['2025',5.625],['2026',2.560]];
const common={paper_bgcolor:'rgba(0,0,0,0)',plot_bgcolor:'rgba(0,0,0,0)',font:{color:'#cdd7e8'},margin:{l:55,r:18,t:26,b:46},hovermode:'x unified',legend:{orientation:'h',y:1.1,x:0},xaxis:{gridcolor:'#172034'},yaxis:{gridcolor:'#172034'}};
const f=(x,d=2)=>x==null?'—':Number(x).toFixed(d), pct=x=>(x>=0?'+':'')+f(x,2)+'%', money=x=>'$'+Math.round(x).toLocaleString();
function ddFrom(eq){let p=-Infinity;return eq.map(v=>{p=Math.max(p,v);return 100*(v/p-1)})}
function annualFrom(dates,eq){const last={};dates.forEach((d,i)=>last[d.slice(0,4)]={e:eq[i],d});let prev=1;return Object.keys(last).sort().map(y=>{const r=100*(last[y].e/prev-1);prev=last[y].e;return {year:y,return_pct:r}})}
function regimeCurve(){let e=1,ds=[],es=[];REGIME_ANNUAL.forEach(([y,r])=>{e*=1+r/100;ds.push(y==='2026'?'2026-03-31':y+'-12-31');es.push(e)});return{dates:ds,equity:es,drawdown:ddFrom(es),annual:REGIME_ANNUAL.map(x=>({year:x[0],return_pct:x[1]})),resolution:'annual endpoints'}}
let D={},selected='ALL';
async function load(){const [h,u,l,n]=await Promise.all(['data/historical.json','data/upper_box50_exact.json','data/late_survival_monthly.json','data/new_shadow_backtest.json'].map(x=>fetch(x+'?t='+Date.now(),{cache:'no-store'}).then(r=>r.json())));['MAIN-B','BENCH-A','SHADOW-3S','SHADOW-SAT20'].forEach(id=>D[id]={dates:h.dates,equity:h.equity[id],drawdown:ddFrom(h.equity[id]),annual:annualFrom(h.dates,h.equity[id]),resolution:'frozen curve'});D['REGIME-COMBO50']=regimeCurve();D['UPPER-BOX50']={dates:u.dates,equity:u.equity,drawdown:(u.drawdown||ddFrom(u.equity)).map(x=>100*x),annual:annualFrom(u.dates,u.equity),resolution:'exact daily'};['LATE-SURVIVAL-50','LATE-SURVIVAL-67'].forEach(id=>{const x=l.strategies[id];D[id]={dates:x.dates,equity:x.equity,drawdown:x.drawdown.map(v=>100*v),annual:n.strategies[id].annual.map(a=>({year:String(a.year),return_pct:a.return_pct})),resolution:'monthly display from exact daily replay'}});const q=new URLSearchParams(location.search).get('strategy');if(q&&IDS.includes(q))selected=q;build();render()}
function build(){const b=document.getElementById('buttons');b.innerHTML=['ALL',...IDS].map(id=>`<button class="${id===selected?'on':''}" data-id="${id}">${id==='ALL'?'ALL 8':LABEL[id]}</button>`).join('');b.querySelectorAll('button').forEach(x=>x.onclick=()=>{selected=x.dataset.id;b.querySelectorAll('button').forEach(y=>y.classList.toggle('on',y===x));render()})}
function traces(ids,key){return ids.map(id=>({x:D[id].dates,y:key==='capital'?D[id].equity.map(v=>v*100000):D[id][key],name:LABEL[id],type:'scatter',mode:'lines'}))}
function render(){const ids=selected==='ALL'?IDS:[selected];const focus=selected==='ALL'?null:META[selected];document.getElementById('cards').innerHTML=selected==='ALL'?`<div class="card"><div class="k">Strategies</div><div class="v">8</div><div class="m">统一历史中心</div></div><div class="card"><div class="k">Best ending multiple</div><div class="v">${f(Math.max(...IDS.map(i=>META[i].ending)),2)}×</div><div class="m">仅描述，不作策略排名</div></div><div class="card"><div class="k">Period</div><div class="v">2019–26</div><div class="m">2026 through Mar</div></div>`:`<div class="card"><div class="k">Ending multiple</div><div class="v">${f(focus.ending,3)}×</div><div class="m">Total ${pct((focus.ending-1)*100)}</div></div><div class="card"><div class="k">CAGR</div><div class="v">${f(focus.cagr,2)}%</div></div><div class="card"><div class="k">Max drawdown</div><div class="v">${f(focus.mdd,2)}%</div></div><div class="card"><div class="k">Calmar</div><div class="v">${f(focus.cagr/Math.abs(focus.mdd),3)}</div></div><div class="card"><div class="k">Trades</div><div class="v">${focus.trades}</div></div><div class="card"><div class="k">Curve resolution</div><div class="v" style="font-size:15px">${D[selected].resolution}</div></div>`;
Plotly.react('equity',traces(ids,'equity'),{...common,yaxis:{...common.yaxis,title:'Equity multiple'}},{responsive:true,displaylogo:false});Plotly.react('dd',traces(ids,'drawdown'),{...common,yaxis:{...common.yaxis,title:'Drawdown %',ticksuffix:'%'}},{responsive:true,displaylogo:false});Plotly.react('capital',traces(ids,'capital'),{...common,yaxis:{...common.yaxis,title:'Account value',tickprefix:'$'}},{responsive:true,displaylogo:false});const years=['2019','2020','2021','2022','2023','2024','2025','2026'];Plotly.react('annual',ids.map(id=>{const m=Object.fromEntries(D[id].annual.map(x=>[String(x.year),x.return_pct]));return{x:years,y:years.map(y=>m[y]??null),name:LABEL[id],type:'bar'}}),{...common,barmode:selected==='ALL'?'group':'relative',yaxis:{...common.yaxis,title:'Annual return %',ticksuffix:'%'}},{responsive:true,displaylogo:false});document.getElementById('summary').innerHTML='<table><thead><tr><th>Strategy</th><th>Role</th><th>Ending</th><th>Total return</th><th>CAGR</th><th>Max DD</th><th>Calmar</th><th>Trades</th><th>$100k →</th></tr></thead><tbody>'+IDS.map(id=>{const m=META[id];return`<tr><td><button onclick="selected='${id}';build();render()" style="background:none;border:0;color:#9fc2ff;cursor:pointer">${LABEL[id]}</button></td><td>${ROLE[id]}</td><td>${f(m.ending,3)}×</td><td>${pct((m.ending-1)*100)}</td><td>${f(m.cagr,2)}%</td><td>${f(m.mdd,2)}%</td><td>${f(m.cagr/Math.abs(m.mdd),3)}</td><td>${m.trades}</td><td>${money(m.ending*100000)}</td></tr>`}).join('')+'</tbody></table>';document.getElementById('note').innerHTML=`<b>口径：</b> 八条策略统一放在这一栏。REGIME-COMBO50 的仓库历史只保存冻结账户回放的年度端点，因此不伪造日线；Upper-Box 使用 exact daily replay；Late-50/67 的展示曲线按 exact daily replay 下采样到月末，收益指标仍来自完整账户回放。MAIN-B 仍是唯一正式主线，其余为 benchmark / shadow。`}
load().catch(e=>document.getElementById('note').textContent='LOAD FAILED: '+e.message);
</script></body></html>
